<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8734a"/>
      <stop offset="100%" stop-color="#e3a857"/>
    </linearGradient>
    <clipPath id="badge">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
    <clipPath id="calendarSide">
      <polygon points="12,12 52,12 52,52"/>
    </clipPath>
    <clipPath id="notepadSide">
      <polygon points="12,12 12,52 52,52"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="url(#bg)"/>

    <!-- one page, split diagonally: calendar grid upper-right, ruled notes lower-left -->
    <rect x="12" y="12" width="40" height="40" rx="6" fill="#ffffff"/>

    <g clip-path="url(#calendarSide)">
      <path d="M12 12 h34 a6 6 0 0 1 6 6 v4 h-40 z" fill="#e3a857"/>
      <rect x="35" y="21" width="5" height="5" rx="1.2" fill="#c9532e"/>
      <rect x="43" y="21" width="5" height="5" rx="1.2" fill="#c9532e"/>
      <rect x="35" y="29" width="5" height="5" rx="1.2" fill="#c9532e"/>
      <rect x="43" y="29" width="5" height="5" rx="1.2" fill="#c9532e"/>
    </g>

    <g clip-path="url(#notepadSide)">
      <line x1="16" y1="34" x2="29" y2="34" stroke="#e8734a" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="16" y1="41" x2="34" y2="41" stroke="#e8734a" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="16" y1="48" x2="40" y2="48" stroke="#e8734a" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- pen lying along the same diagonal (top-left to bottom-right), tying both halves into one icon -->
    <line x1="16" y1="16" x2="48" y2="48" stroke="#3c2c1f" stroke-width="5" stroke-linecap="round"/>
    <line x1="41" y1="41" x2="48" y2="48" stroke="#e3a857" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="20" y2="20" stroke="#f4ede3" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
